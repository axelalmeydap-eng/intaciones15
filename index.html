<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis 15 Años</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to bottom, #ffc0cb, #ffffff);
  }

  body {
    display: flex;
    flex-direction: column;
    text-align: center;
  }

  h1 {
    margin: 10px 0;
    font-size: 26px;
    color: #d63384;
  }

  .sub {
    font-size: 15px;
    margin-bottom: 5px;
  }

  button {
    margin: 10px auto;
    padding: 10px 20px;
    background: #ff69b4;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
  }

  button:hover {
    background: #ff1493;
  }

  .lista {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    background: rgba(255,255,255,0.9);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    padding: 15px;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
  }

  .item {
    margin: 15px 0;
  }

  video, img {
    width: 100%;
    border-radius: 15px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.3);
  }

  .texto {
    font-size: 16px;
    color: #444;
  }

  .btn-maps {
    background: linear-gradient(45deg, gold, #ffd700);
    color: black;
    font-weight: bold;
    box-shadow: 0 0 10px gold;
  }
</style>

</head>

<body>

<h1>💖 Mis 15 Años 💖</h1>
<p class="sub">✨ Estás invitado a una noche especial ✨</p>

<button onclick="document.getElementById('musica').play()">
🎵 Reproducir música
</button>

<audio id="musica" loop>
  <source src="cancion.mp4" type="audio/mp4">
</audio>

<div class="lista">

  <div class="item texto">💖 Acompáñame en este día inolvidable 💖</div>

  <div class="item">
    <video src="foto1.mp4" autoplay loop muted></video>
  </div>

  <div class="item">
    <video src="foto2.mp4" autoplay loop muted></video>
  </div>

  <!-- FOTO 3 -->
  <div class="item">
    <img src="foto3.png">
  </div>

  <!-- BOTÓN DE UBICACIÓN AQUÍ -->
  <div class="item">
    <a href="https://maps.app.goo.gl/v6s4vfXHvhCtWia69" target="_blank">
      <button class="btn-maps">📍 Ver ubicación</button>
    </a>
  </div>

  <div class="item texto">📍 Lugar: Hotel resort Thiago - Gocio Prado</div>
  <div class="item texto">📅 Fecha: Sábado 09 de Mayo</div>
  <div class="item texto">🕗 Hora: 8:00 PM</div>

  <div class="item">
    <video src="foto4.mp4" autoplay loop muted></video>
  </div>

  <div class="item">
    <video src="foto5.mp4" autoplay loop muted></video>
  </div>

  <div class="item texto">💃 ¡Te espero, no faltes! 💃</div>

</div>

</body>
</html>
