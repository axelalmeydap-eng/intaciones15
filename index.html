<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis 15 Años</title>

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to bottom, #ffc0cb, #ffffff);
    text-align: center;
  }

  h1 {
    padding: 20px;
    font-size: 28px;
    color: #d63384;
  }

  .sub {
    font-size: 16px;
    margin-bottom: 10px;
  }

  /* AHORA OCUPA TODA LA PANTALLA */
  .lista {
    width: 95%;
    max-width: 500px;
    height: 70vh;
    margin: auto;
    overflow-y: auto;
    background: rgba(255,255,255,0.8);
    border-radius: 20px;
    padding: 15px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
  }

  .item {
    margin: 15px 0;
  }

  video, img {
    width: 100%;
    border-radius: 15px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.3);
  }

  .texto {
    font-size: 16px;
    color: #444;
  }

  button {
    margin: 10px;
    padding: 10px 20px;
    background: #ff69b4;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 15px;
  }

  button:hover {
    background: #ff1493;
  }
</style>

</head>

<body>

<h1>💖 Mis 15 Años 💖</h1>
<p class="sub">✨ Estás invitado a una noche especial ✨</p>

<button onclick="document.getElementById('musica').play()">
🎵 Reproducir música
</button>

<audio id="musica" loop>
  <source src="cancion.mp4" type="audio/mp4">
</audio>

<div class="lista">

  <div class="item texto">💖 Acompáñame en este día inolvidable 💖</div>

  <div class="item">
    <video src="foto1.mp4" autoplay loop muted></video>
  </div>

  <div class="item">
    <video src="foto2.mp4" autoplay loop muted></video>
  </div>

  <div class="item">
    <img src="foto3.png">
  </div>

  <div class="item texto">📍 Lugar: Hotel resort Thiago - Gocio Prado</div>
  <div class="item texto">📅 Fecha: Sábado 09 de Mayo</div>
  <div class="item texto">🕗 Hora: 8:00 PM</div>

  <div class="item">
    <video src="foto4.mp4" autoplay loop muted></video>
  </div>

  <div class="item">
    <video src="foto5.mp4" autoplay loop muted></video>
  </div>

  <div class="item texto">💃 ¡Te espero, no faltes! 💃</div>

</div>

</body>
</html>
