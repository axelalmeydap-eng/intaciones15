<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis 15 Años</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Segoe UI', sans-serif;
    background: white; /* 🔥 fondo blanco */
  }

  body {
    display: flex;
    flex-direction: column;
    text-align: center;
  }

  h1 {
    margin: 10px 0;
    font-size: 26px;
    color: #333; /* más elegante */
  }

  .sub {
    font-size: 15px;
    margin-bottom: 5px;
    color: #555;
  }

  button {
    margin: 10px auto;
    padding: 10px 20px;
    background: #d4af37; /* dorado elegante */
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
  }

  button:hover {
    background: #b8962e;
  }

  .lista {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    background: #ffffff;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    padding: 15px;
    box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
  }

  .item {
    margin: 15px 0;
  }

  video, img {
    width: 100%;
    border-radius: 15px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
  }

  .texto {
    font-size: 16px;
    color: #444;
  }

  .btn-maps {
    background: linear-gradient(45deg, gold, #d4af37);
    color: black;
    font-weight: bold;
    box-shadow: 0 0 8px rgba(212,175,55,0.6);
  }
</style>

</head>

<body>

<h1>Mis 15 Años</h1>
<p class="sub">Estás invitado a una noche especial</p>

<button onclick="document.getElementById('musica').play()">
Reproducir música
</button>

<audio id="musica" loop>
  <source src="cancion.mp4" type="audio/mp4">
</audio>

<div class="lista">

  <div class="item texto">Acompáñame en este día inolvidable</div>

  <div class="item">
    <video src="foto1.mp4" autoplay loop muted></video>
  </div>

  <div class="item">
    <video src="foto2.mp4" autoplay loop muted></video>
  </div>

  <div class="item">
    <img src="foto3.png">
  </div>

  <!-- BOTÓN DE UBICACIÓN -->
  <div class="item">
    <a href="https://maps.app.goo.gl/v6s4vfXHvhCtWia69" target="_blank">
      <button class="btn-maps">Ver ubicación</button>
    </a>
  </div>

  <div class="item">
    <video src="foto4.mp4" autoplay loop muted></video>
  </div>

  <div class="item">
    <video src="foto5.mp4" autoplay loop muted></video>
  </div>

  <div class="item texto">Te espero, no faltes</div>

</div>

</body>
</html>
